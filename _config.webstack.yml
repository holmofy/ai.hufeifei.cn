    img: https://mintcdn.com/zed-685ed6d6/ZwvtxaoaZwBJrK5s/logo/light.svg
    description: ACP 旨在通过标准化代码编辑器与 AI 编程助手之间的通信协议，消除因缺乏统一接口而产生的重复集成工作、兼容性差及用户被绑定等痛点，从而像 LSP 统一语言服务器那样实现两者的解耦与互操作。
